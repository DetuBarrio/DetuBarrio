spring.application.name=rest

# Carga variables desde .env (formato KEY=VALUE)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT}

# MySQL lo gestionas manualmente con Docker/Workbench; evita que Spring intente levantar docker-compose.
spring.docker.compose.enabled=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never

logging.level.org.springframework.security=INFO

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION:86400}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS permitidos en producción (separados por coma). Valor por defecto: * (todo)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary para imágenes en producción. Si no defines estas variables,
# el backend usa el almacenamiento local como fallback en desarrollo.
CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:}
CLOUDINARY_FOLDER=${CLOUDINARY_FOLDER:detubarrio}

app.contact.admin-email=${CONTACT_ADMIN_EMAIL:info@detubarrio.local}
app.contact.from-email=${CONTACT_FROM_EMAIL:no-reply@detubarrio.local}
app.frontend.url=${APP_FRONTEND_URL}
spring.flyway.baseline-on-migrate=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000