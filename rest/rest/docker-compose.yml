services:
  mysql:
    image: mysql:8.4
    container_name: detubarrio-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: detubarrio
      MYSQL_USER: detubarrio
      MYSQL_PASSWORD: detubarrio123
      MYSQL_ROOT_PASSWORD: root1234
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "detubarrio", "-pdetubarrio123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: